name: Build, Test and Publish ITL ControlPlane SDK

# Replaces a previous version of this workflow that targeted public PyPI via OIDC trusted
# publishing - confirmed live that every run of that version failed (10/10 since it was
# created, none since), and OIDC trusted publishing doesn't apply to a self-hosted Forgejo
# package registry anyway (that's a PyPI.org-specific mechanism). This publishes to
# ITlusions' own Forgejo instance instead - an internal platform SDK has no reason to be on
# public PyPI at all.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PACKAGE_NAME: itl-controlplane-sdk
  PYTHON_VERSION: "3.12"
  # git.itlusions.com's own PyPI-compatible package registry, owned by the ITlusions org -
  # NOT registry.itlusions.com, which is a plain Docker Registry v2 instance with no PyPI
  # API at all (confirmed live - pip/twine cannot talk to it).
  FORGEJO_PYPI_URL: https://git.itlusions.com/api/packages/ITlusions/pypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build --sdist --wheel --outdir dist/

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Test install in a clean venv
        run: |
          python -m venv test-env
          test-env/bin/pip install dist/*.whl
          test-env/bin/python -c "import itl_controlplane_sdk; print('import OK:', itl_controlplane_sdk.__file__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: python -m pip install --upgrade twine

      - name: Publish to Forgejo package registry
        env:
          TWINE_REPOSITORY_URL: ${{ env.FORGEJO_PYPI_URL }}
          # Forgejo's package API uses plain basic auth (username + a personal access token
          # with package:write scope), not PyPI.org-style OIDC trusted publishing - these two
          # secrets must be added to this repo (Settings -> Secrets and variables -> Actions)
          # before this job can succeed.
          TWINE_USERNAME: ${{ secrets.FORGEJO_PACKAGE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
        run: twine upload dist/* --verbose

      - name: Verify it installs from Forgejo
        env:
          FORGEJO_PACKAGE_USERNAME: ${{ secrets.FORGEJO_PACKAGE_USERNAME }}
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
        run: |
          python -m venv verify-env
          # Forgejo's package index requires auth even just to browse it (private org) -
          # confirmed live: an unauthenticated request gets a 401 and pip tries to prompt
          # interactively for credentials, which just hangs/EOFs on a CI runner. Credentials
          # go in the URL itself, not a separate --extra-index-url - deliberately NOT falling
          # back to public PyPI here either (pip checks whichever index it's given first, and
          # mixing in the public index risks a dependency-confusion attack on an internal-only
          # package name).
          # Pinned to this exact release (not a bare package name) - confirmed live that an
          # unpinned install makes pip consider every version on the index at once, and it
          # hit a resolver bug/quirk reporting a conflict between itl-controlplane-sdk 1.0.4
          # and 1.0.5 (the SAME package, two of its own versions) that made no real sense.
          # Pinning also makes this test strictly correct: it verifies THIS release
          # installs, not "whatever latest happens to resolve to".
          #
          # --extra-index-url for public PyPI IS needed here, despite the dependency-
          # confusion concern raised earlier - confirmed live that removing it entirely
          # broke resolution of the package's OWN third-party dependencies (pydantic etc.),
          # since Forgejo's registry only hosts itl-controlplane-sdk itself, not a mirror of
          # all of PyPI. The version pin above is what actually neutralizes the confusion
          # risk for THIS package specifically: pip can only satisfy an exact, internal-only
          # version string (1.0.6) from Forgejo, since that version will never exist on
          # public PyPI - so which index pip checks first no longer matters for this name.
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          verify-env/bin/pip install \
            --index-url "https://${FORGEJO_PACKAGE_USERNAME}:${FORGEJO_PACKAGE_TOKEN}@git.itlusions.com/api/packages/ITlusions/pypi/simple/" \
            --extra-index-url https://pypi.org/simple/ \
            "${{ env.PACKAGE_NAME }}==${RELEASE_VERSION}"
          verify-env/bin/python -c "import itl_controlplane_sdk; print('installed from Forgejo OK')"

  create-release:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            pip install --index-url ${{ env.FORGEJO_PYPI_URL }}/simple/ ${{ env.PACKAGE_NAME }}==${{ github.ref_name }}
            ```

            Published to ITlusions' own Forgejo package registry (`git.itlusions.com`), not
            public PyPI - this is an internal platform SDK.
