          - paragraph [ref=e83]:
            - text: In deze GitHub-omgeving wordt gewerkt aan de BIO2, het het kader voor informatiebeveiliging voor de overheid. Hierin is feedback verwerkt, afkomstig uit GitHub. Ook met het
            - link "evaluatierapport van de BIO" [ref=e84] [cursor=pointer]:
              - /url: https://bio-overheid.nl/category/producten/rapport-bio-evaluatie
            - text: en workshops met de overheden is nuttige feedback opgehaald. Op deze GitHub-pagina blijven we ook in de toekomst samenwerken tijdens het onderhoud op de BIO2.
          - heading "Wijzigingen BIO2 ¶" [level=2] [ref=e85]:
            - text: Wijzigingen BIO2
            - link "¶" [ref=e86] [cursor=pointer]:
              - /url: http://localhost:8000/#wijzigingen-bio2
          - paragraph [ref=e87]:
            - text: Heb je een een wijzigingsverzoek voor de BIO2, deel jouw inbreng via GitHub. In
            - link "CONTRIBUTING" [ref=e88] [cursor=pointer]:
              - /url: https://github.com/MinBZK/Baseline-Informatiebeveiliging-Overheid/blob/main/CONTRIBUTING.md
            - text: staat hoe je kan bijdragen. De aanvullingen die we ontvangen, worden beoordeeld door het het beheerteam BIO, de werkgroep BIO en/of het kern-IBO.
          - heading "Leeswijzer BIO2 ¶" [level=2] [ref=e89]:
            - text: Leeswijzer BIO2
            - link "¶" [ref=e90] [cursor=pointer]:
              - /url: http://localhost:8000/#leeswijzer-bio2
          - paragraph [ref=e91]:
            - text: Via het horizontale navigatiemenu aan de bovenzijde kom je bij de documenten/onderdelen van de BIO2.
            - text: "De volgende documenten/onderdelen zijn beschikbaar: - Ontwerp - BIO2 inleiding - Verplichte maatregelen en richtlijnen"
          - heading "Meer informatie BIO ¶" [level=2] [ref=e92]:
