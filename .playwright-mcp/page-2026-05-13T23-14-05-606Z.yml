      - generic [ref=e129]:
        - generic [ref=e130]:
          - paragraph [ref=e131]: De rijksoverheidfonts zijn speciaal ontworpen voor de Rijksoverheid en derhalve uitsluitend voorbehouden aan de Rijksoverheid. De twee varianten zijn de Rijksoverheid Serif (schreefletter) en de Rijksoverheid Sans (schreefloze letter). Er zijn aparte sets voor drukwerk, online toepassingen en weginformatieborden.
          - paragraph [ref=e132]: "Let op: voor alle ontwerpen wordt in de gemoderniseerde Rijkshuisstijl het variabele font gebruikt. De oude fontversies worden alleen nog aangeboden voor oude ontwerpen in de oude Rijkshuisstijl."
        - generic [ref=e137]:
          - generic [ref=e138]:
            - heading "Gebruiksrichtlijnen" [level=2] [ref=e139]
            - list [ref=e141]:
              - listitem [ref=e142]: De rijksoverheidfonts mogen uitsluitend voor rijksoverheidspublicaties ingezet worden.
              - listitem [ref=e143]: De Rijksoverheid Sans heeft een primaire rol en wordt gebruikt als broodtekst. Dit betekent ook dat de Rijksoverheid Sans op beeldbepalende plekken wordt gebruikt. Denk hierbij bijvoorbeeld aan titels, ondertitels, grotere headings en andere prominente teksten.
              - listitem [ref=e144]: De Rijksoverheid Sans is een variabel font. Wees gematigd met de vele toepassingen die een variabel font met zicht meebrengt.
              - listitem [ref=e145]: "De Rijksoverheid Serif heeft een ondergeschikte rol en hoeft daarom ook niet verplicht gebruikt te worden. De Serif kun je gebruiken voor broodteksten, quotes, kleinere headings & binnenwerk en bijschriften. (Let op: de Rijksoverheid Serif is geen variabel font)."
              - listitem [ref=e146]: Teksten worden bij voorkeur links uitgelijnd. Indien het ontwerp er om vraagt kan tekst eventueel rechts uitgelijnd of gecentreerde geplaatst worden.
              - listitem [ref=e147]: Wees terughoudend in het gebruik van grote schreeuwende teksten.
              - listitem [ref=e148]: Vanuit de toegankelijkheidseisen wordt er geadviseerd om voorzichtig te zijn met de uitersten van het font. Wees scherp op de leesbaarheid bij 'thin' en 'extra bold'.
              - listitem [ref=e149]: Het font is niet bedoeld als extra huisstijlelement, bijvoorbeeld als grafische achtergrond.
              - listitem [ref=e150]:
                - text: Voor broodteksten gebruiken we bij voorkeur lintblauw, maar zwart en / of wit (diapositief) mag ook als dit de toegankelijkheid verbeterd.
                - list [ref=e151]:
                  - listitem [ref=e152]: "Let op: gebruik bij CMYK-drukwerk zwart (K=100%) voor broodtekst om onscherpe contouren bij kleine letters te voorkomen."
              - listitem [ref=e153]: Overweeg de lintkleur te combineren met één andere primaire kleur of accentkleur uit het kleurenpalet? Let er daarbij op dat de combinatie professioneel oogt en niet resulteert in een overdaad aan kleuren. Kies kleuren die elkaar aanvullen en beperk je tot maximaal een kleur naast het lintblauw, zodat het geheel rustig en samenhangend blijft.
              - listitem [ref=e154]:
                - text: Het toevoegen van andere fonts is niet toegestaan. Er geldt een uitzondering bij
                - link "aangemelde campagnes." [ref=e155] [cursor=pointer]:
                  - /url: https://www.rijkshuisstijl.nl/modules/folder/brandguide/default/index.aspx?ItemId=10657
          - figure [ref=e158]:
            - img "Hier zie je een voorbeeld van de Rijksoverheid Sans." [ref=e159]
          - generic [ref=e160]:
            - 'heading "Alternatief: systeemlettertypen" [level=2] [ref=e161]'
            - generic [ref=e162]:
              - heading "Arial en Verdana" [level=3] [ref=e163]
              - paragraph [ref=e164]: Voor kantoorautomatisering en digitale presentaties gebruik je Verdana.
              - paragraph [ref=e165]: Voor alle andere digitale toepassingen gebruik je Arial en Verdana als de rijkshuisstijl webfonts niet toegepast kunnen worden.
              - 'heading "Open source: Déja vu" [level=3] [ref=e166]'
              - paragraph [ref=e167]: Maak je gebruik van open source toepassingen voor kantoorautomatisering? Gebruik dan het lettertype Déja vu.
