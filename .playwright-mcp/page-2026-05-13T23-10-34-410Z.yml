      - generic [ref=e127]:
        - paragraph [ref=e129]: De rijkshuisstijl kent één hoofdkleur dat is de blauwe kleur van het lint; lintblauw. Naast lintblauw zijn er 17 communicatiekleuren en één ondersteunende grijstint (cool grey).
        - generic [ref=e135]:
          - heading "Gebruiksrichtlijnen" [level=2] [ref=e136]
          - list [ref=e138]:
            - listitem [ref=e139]: Je gebruik altijd de 100% versie van een communicatiekleur.
            - listitem [ref=e140]:
              - text: Percentages van de communicatiekleuren gebruik je ter ondersteuning, bijvoorbeeld bij achtergronden, grafieken of tabellen. Het gebruik kan ook decoratief zijn (bijvoorbeeld bij de
              - link "rijksillustratiestijl" [ref=e141] [cursor=pointer]:
                - /url: https://www.rijkshuisstijl.nl/modules/product/DigitalStyleGuide/default/index.aspx?ItemId=10530
              - text: ).
            - listitem [ref=e142]: "De kleurpercentages zijn: 75%, 60%, 45%, 30% en 15%."
            - listitem [ref=e143]: Pas je kleurpercentages toe, dan mag dat alleen in combinatie met de 100% versie van dezelfde kleur.
            - listitem [ref=e144]: Let erop dat in een communicatie uiting gebruikte kleurpercentages niet de overhand krijgen ten opzichte van de 100% kleuren.
            - listitem [ref=e145]:
              - text: De grijstint (
              - link "cool grey" [ref=e146] [cursor=pointer]:
                - /url: https://www.rijkshuisstijl.nl/modules/product/DigitalStyleGuide/default/index.aspx?ItemId=10815
              - text: ) is geen communicatiekleur en mag ook zo niet gebruikt worden. Deze tint is enkel bedoelt voor achtergrondkaders, grafieken en tabellen, indien de communicatiekleuren niet gebruikt kunnen worden.
            - listitem [ref=e147]: "Je kunt als organisatie geen kleuren claimen: de Rijksoverheid bestaat uit meer dan 100 organisaties die ieder alle kleuren mogen gebruiken."
            - listitem [ref=e148]: De kleuren van de rijkshuisstijl zijn ook als kleurstalen bibliotheek beschikbaar in RGB, CMYK en PMS. De kleurwaarden zijn opgenomen in een .ase-bestand dat je in Photoshop, Illustrator of Indesign kunt importeren.
