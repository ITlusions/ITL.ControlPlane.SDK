    - generic [ref=e50]:
      - heading "Ministerie van Binnenlandse Zaken en Koninkrijksrelaties" [level=1] [ref=e51]
      - paragraph [ref=e54]: "Werken aan de basis van onze samenleving. Een basis waarop iedereen prettig kan leven en wonen. Daar zet het ministerie van Binnenlandse Zaken en Koninkrijksrelaties zich elke dag voor in. In Nederland en in het Caribische deel van ons Koninkrijk. Ons grootste goed is daarbij het uitgangspunt: de Grondwet en wat wij daarin hebben afgesproken. Dat iedereen meetelt bijvoorbeeld. Dat je altijd en overal kan zijn wie je bent, kan vinden wat je vindt, gelijke kansen hebt en mee kan doen. Thuis, op school en op het werk. Dat iedereen een dak boven het hoofd heeft en kan wonen en werken, kan leven, in een prettige en veilige omgeving. We doen dat voor de samenleving en werken tegelijkertijd aan de basis voor de hele Rijksoverheid. Zodat ook andere ministeries hun werk voor Nederland goed kunnen doen."
