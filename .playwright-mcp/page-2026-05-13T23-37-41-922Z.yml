- generic [ref=e2]: "/* ====================================================================== Rijkshuisstijl — Baseline Informatiebeveiliging Overheid Matching: https://www.rijksoverheid.nl Official colors (Rijkshuisstijl Digital Style Guide): Lintblauw #154273 PMS7462c — header nav bar, dark backgrounds Donkerblauw #01689B PMS300C — links, accents, primary Wit #FFFFFF — logo bar, body, text on dark Tekst #000000 — body copy Grijs #535353 — secondary, meta text Lichtgrijs #F3F3F3 — page background tint, table stripes Font: Verdana, Arial (official RO Sans web fallback per Rijkshuisstijl) ====================================================================== */ /* Google Font import (RO Sans approximation) */ @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap'); /* ====================================================================== 1. CSS CUSTOM PROPERTIES ====================================================================== */ :root { --md-primary-fg-color: #01689B; --md-primary-fg-color--light: #007BC7; --md-primary-fg-color--dark: #154273; --md-primary-bg-color: #FFFFFF; --md-primary-bg-color--light: #FFFFFF; --md-accent-fg-color: #01689B; --md-accent-fg-color--transparent: rgba(1,104,155,.12); --md-accent-bg-color: #FFFFFF; --md-text-font: \"Source Sans 3\", Verdana, Arial, Helvetica, sans-serif; --md-code-font: \"Consolas\", \"Courier New\", monospace; --rhs-lintblauw: #154273; --rhs-blauw: #01689B; --rhs-hemelblauw: #007BC7; --rhs-wit: #FFFFFF; --rhs-tekst: #000000; --rhs-grijs: #535353; --rhs-lichtgrijs: #F3F3F3; --rhs-rand: #CCCCCC; } /* ====================================================================== 2. BASE TYPOGRAPHY ====================================================================== */ body, .md-typeset { font-family: var(--md-text-font); font-size: 1rem; line-height: 1.6; color: var(--rhs-tekst); } /* ====================================================================== 3. WHITE LOGO BAR (announce block) ====================================================================== */ .md-announce { background-color: var(--rhs-wit) !important; color: var(--rhs-tekst) !important; padding: 0 !important; border-bottom: 1px solid var(--rhs-rand); } .md-announce__inner { padding: 0 !important; margin: 0 !important; max-width: unset !important; } .rhs-skip-link { position: absolute; top: -999px; left: 1rem; background: var(--rhs-lintblauw); color: var(--rhs-wit); padding: 6px 14px; font-size: 0.9rem; font-weight: 700; text-decoration: none; z-index: 9999; } .rhs-skip-link:focus { top: 0; } .rhs-id-bar { background-color: var(--rhs-wit); width: 100%; } .rhs-id-bar__inner { display: flex; align-items: center; gap: 1.5rem; padding: 10px 1.5rem; max-width: 1280px; margin: 0 auto; } .rhs-id-bar__logo { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; } .rhs-id-bar__logo:hover .rhs-id-bar__name { text-decoration: underline; } .rhs-id-bar__wapen { width: 40px; height: 49px; flex-shrink: 0; } .rhs-id-bar__name { font-family: var(--md-text-font); font-size: 1.1rem; font-weight: 700; color: var(--rhs-lintblauw); letter-spacing: 0.01em; white-space: nowrap; } .rhs-id-bar__ministry { font-family: var(--md-text-font); font-size: 0.82rem; color: var(--rhs-grijs); border-left: 1px solid var(--rhs-rand); padding-left: 1.5rem; line-height: 1.3; } /* ====================================================================== 4. DARK BLUE NAV HEADER (md-header = Lintblauw #154273) ====================================================================== */ .md-header { background-color: var(--rhs-lintblauw); color: var(--rhs-wit); box-shadow: 0 2px 4px rgba(0,0,0,.3); } .md-header__button { color: var(--rhs-wit); } .md-header__button:hover, .md-header__button:focus { opacity: .85; } .md-header__title { color: var(--rhs-wit); font-family: var(--md-text-font); font-size: 0.9rem; font-weight: 400; } .md-search__input { background-color: rgba(255,255,255,.15); color: var(--rhs-wit); border: 1px solid rgba(255,255,255,.25); border-radius: 0; font-family: var(--md-text-font); } .md-search__input::placeholder { color: rgba(255,255,255,.65); } .md-search__input:focus { background-color: var(--rhs-wit); color: var(--rhs-tekst); border-color: var(--rhs-wit); } .md-search__icon { color: rgba(255,255,255,.8); } .md-search-result__title { color: var(--rhs-lintblauw); font-weight: 700; } .md-search-result__teaser mark { background-color: rgba(1,104,155,.15); color: var(--rhs-blauw); } .md-header__button.md-icon { color: var(--rhs-wit); } /* ====================================================================== 5. TABS NAVIGATION ====================================================================== */ .md-tabs { background-color: var(--rhs-lintblauw); border-top: 1px solid rgba(255,255,255,.15); } .md-tabs__link { color: rgba(255,255,255,.75); font-family: var(--md-text-font); font-size: 0.82rem; font-weight: 600; text-transform: none; letter-spacing: 0; } .md-tabs__link:hover { color: var(--rhs-wit); } .md-tabs__link--active { color: var(--rhs-wit); border-bottom: 3px solid var(--rhs-wit); } /* ====================================================================== 6. SIDEBAR / NAVIGATION ====================================================================== */ .md-nav__title { color: var(--rhs-lintblauw); font-family: var(--md-text-font); font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--rhs-rand); padding-bottom: 0.5rem; margin-bottom: 0.25rem; } .md-nav__item { font-family: var(--md-text-font); font-size: 0.9rem; } .md-nav__link { color: var(--rhs-blauw); transition: color .15s; } .md-nav__link:hover, .md-nav__link:focus { color: var(--rhs-lintblauw); text-decoration: underline; } .md-nav__link--active { color: var(--rhs-lintblauw); font-weight: 700; text-decoration: none; } .md-nav__link--active::before { background-color: var(--rhs-blauw); } .md-nav--secondary .md-nav__title { color: var(--rhs-lintblauw); } .md-nav--secondary .md-nav__link { color: var(--rhs-blauw); font-size: 0.85rem; } .md-nav--secondary .md-nav__link--active { color: var(--rhs-lintblauw); font-weight: 700; border-left: 3px solid var(--rhs-blauw); padding-left: 0.5rem; } /* ====================================================================== 7. MAIN CONTENT ====================================================================== */ .md-content, .md-main__inner, .md-grid { background-color: var(--rhs-wit); } .md-typeset h1 { font-family: var(--md-text-font); font-size: 2rem; font-weight: 700; color: var(--rhs-lintblauw); border-bottom: 4px solid var(--rhs-lintblauw); padding-bottom: 0.4em; margin-bottom: 0.75em; line-height: 1.2; } .md-typeset h2 { font-family: var(--md-text-font); font-size: 1.5rem; font-weight: 700; color: var(--rhs-lintblauw); border-bottom: 1px solid var(--rhs-rand); padding-bottom: 0.25em; margin-top: 2rem; } .md-typeset h3 { font-family: var(--md-text-font); font-size: 1.2rem; font-weight: 700; color: var(--rhs-lintblauw); } .md-typeset h4, .md-typeset h5, .md-typeset h6 { font-family: var(--md-text-font); font-weight: 700; color: var(--rhs-lintblauw); } .md-typeset p, .md-typeset li { font-family: var(--md-text-font); font-size: 1rem; line-height: 1.7; color: var(--rhs-tekst); } .md-typeset a { color: var(--rhs-blauw); text-decoration: underline; } .md-typeset a:hover, .md-typeset a:focus { color: var(--rhs-lintblauw); text-decoration: underline; } .md-typeset a:visited { color: var(--rhs-lintblauw); } .md-typeset ul > li::marker { color: var(--rhs-blauw); } .md-typeset table:not([class]) th { background-color: var(--rhs-lintblauw); color: var(--rhs-wit); font-family: var(--md-text-font); font-weight: 700; padding: 0.6rem 1rem; } .md-typeset table:not([class]) td { font-family: var(--md-text-font); padding: 0.5rem 1rem; border-bottom: 1px solid var(--rhs-rand); } .md-typeset table:not([class]) tr:nth-child(even) { background-color: var(--rhs-lichtgrijs); } .md-typeset blockquote { border-left: 4px solid var(--rhs-blauw); background-color: rgba(1,104,155,.05); padding: 0.75rem 1.25rem; color: var(--rhs-grijs); font-style: italic; } .md-typeset code { background-color: var(--rhs-lichtgrijs); color: var(--rhs-lintblauw); border: 1px solid var(--rhs-rand); border-radius: 2px; padding: 1px 5px; font-family: var(--md-code-font); font-size: 0.88em; } .md-typeset pre > code { background-color: #1A1A2E; color: #E8EAF0; border: none; border-radius: 0; padding: 1rem 1.25rem; } .md-typeset pre { border-left: 4px solid var(--rhs-blauw); } .md-typeset .admonition, .md-typeset details { border: 1px solid var(--rhs-rand); border-left: 4px solid var(--rhs-blauw); border-radius: 0; box-shadow: none; font-family: var(--md-text-font); } .md-typeset .admonition-title, .md-typeset summary { background-color: rgba(1,104,155,.07); font-weight: 700; font-family: var(--md-text-font); } .md-typeset .tip { border-left-color: #39870c; } .md-typeset .tip > .admonition-title, .md-typeset .tip > summary { background-color: rgba(57,135,12,.07); } .md-typeset .warning { border-left-color: #D52B1E; } .md-typeset .warning > .admonition-title, .md-typeset .warning > summary { background-color: rgba(213,43,30,.07); } .md-typeset .important { border-left-color: var(--rhs-lintblauw); } .md-button { background-color: var(--rhs-blauw); color: var(--rhs-wit); border: none; border-radius: 0; font-family: var(--md-text-font); font-weight: 700; padding: 0.6rem 1.5rem; transition: background-color .15s; } .md-button:hover, .md-button:focus { background-color: var(--rhs-lintblauw); color: var(--rhs-wit); } /* ====================================================================== 8. FOOTER ====================================================================== */ .md-footer { display: none; } .rhs-footer { background-color: var(--rhs-lintblauw); color: rgba(255,255,255,.85); font-family: var(--md-text-font); font-size: 0.9rem; margin-top: 3rem; } .rhs-footer__top { display: flex; flex-wrap: wrap; gap: 3rem; align-items: flex-start; padding: 2.5rem 2rem 2rem; max-width: 1280px; margin: 0 auto; border-bottom: 1px solid rgba(255,255,255,.15); } .rhs-footer__brand { display: flex; align-items: flex-start; gap: 0.9rem; flex-shrink: 0; } .rhs-footer__wapen { width: 34px; height: 41px; flex-shrink: 0; margin-top: 2px; } .rhs-footer__brand-text { display: flex; flex-direction: column; gap: 3px; } .rhs-footer__naam { display: block; font-size: 1rem; font-weight: 700; color: var(--rhs-wit); } .rhs-footer__ministerie { display: block; font-size: 0.78rem; color: rgba(255,255,255,.7); line-height: 1.4; } .rhs-footer__nav { display: flex; flex-wrap: wrap; gap: 2.5rem; flex: 1; } .rhs-footer__col { min-width: 140px; } .rhs-footer__kop { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--rhs-wit) !important; margin: 0 0 0.6rem; padding: 0; border: none !important; } .rhs-footer__lijst { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.4rem; } .rhs-footer__link { color: rgba(255,255,255,.75); text-decoration: none; font-size: 0.85rem; transition: color .15s; } .rhs-footer__link:hover, .rhs-footer__link:focus { color: var(--rhs-wit); text-decoration: underline; } .rhs-footer__bottom { background-color: rgba(0,0,0,.2); padding: 1rem 2rem; text-align: center; } .rhs-footer__copy { font-size: 0.78rem; color: rgba(255,255,255,.55); margin: 0; } /* ====================================================================== 9. TAGS ====================================================================== */ .md-tag { background-color: var(--rhs-blauw); color: var(--rhs-wit); border-radius: 0; font-family: var(--md-text-font); font-size: 0.75rem; font-weight: 700; padding: 2px 8px; } /* ====================================================================== 10. SCROLLBAR (Chromium) ====================================================================== */ ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: var(--rhs-lichtgrijs); } ::-webkit-scrollbar-thumb { background-color: var(--rhs-blauw); border-radius: 0; } ::-webkit-scrollbar-thumb:hover { background-color: var(--rhs-lintblauw); } /* ====================================================================== 11. RESPONSIVE ====================================================================== */ @media screen and (max-width: 76.25em) { .rhs-id-bar__ministry { display: none; } } @media screen and (max-width: 60em) { .rhs-id-bar__inner { padding: 8px 1rem; } .rhs-footer__top { flex-direction: column; gap: 1.5rem; padding: 1.5rem 1rem; } .rhs-footer__nav { gap: 1.5rem; } } @media screen and (max-width: 30em) { .md-typeset h1 { font-size: 1.5rem; } .md-typeset h2 { font-size: 1.2rem; } }"