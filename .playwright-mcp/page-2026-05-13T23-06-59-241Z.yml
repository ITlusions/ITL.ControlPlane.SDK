    - generic [ref=e99]:
      - heading "Over de rijkshuisstijl" [level=1] [ref=e102]
      - generic [ref=e104]:
        - paragraph [ref=e105]: De ministerraad besloot op 4 juli 2007 dat alle organisaties die rechtstreeks onder ministeriële verantwoordelijkheid vallen, de rijkshuisstijl moeten voeren. Dit zijn ministeries, inspecties, (uitvoerings)organisaties, agentschappen en interdepartementale afzenders.
        - heading "Doel rijkshuisstijl" [level=2] [ref=e106]
        - paragraph [ref=e107]: De invoering van één logo en huisstijl was de randvoorwaarde voor een herkenbare en toegankelijke Rijksoverheid. Want ontkokering in beleid, uitvoering en dienstverlening kan niet zonder eenheid in communicatie. Door de invoering van één logo en huisstijl is de Rijksoverheid direct als afzender herkenbaar.
        - heading "Missie en motto" [level=2] [ref=e108]
        - paragraph [ref=e109]: De Rijksoverheid werkt aan herkenbaarheid, eenduidigheid en toegankelijkheid. Missie en motto onderstrepen waar de eenduidige Rijksoverheid voor staat. Ze geven het rijkslogo een inhoudelijke lading. De missie verwoordt wat alle organisaties van de Rijksoverheid bindt.
        - heading "Missie" [level=3] [ref=e110]: Missie
        - paragraph [ref=e111]: “De Rijksoverheid werkt aan een rechtvaardige, ondernemende en duurzame samenleving. In onze democratische rechtsstaat is het belangrijk dat mensen en maatschappelijke organisaties zich in vrijheid en veiligheid kunnen ontplooien. Daarvoor zijn keuzes nodig, in Nederland, in Europa, in de wereld. De Rijksoverheid weegt belangen tegen elkaar af, investeert in de toekomst en treedt op als dat nodig is. Dat doet zij met hart voor de publieke zaak, integer en met kennis van zaken. De Rijksoverheid. Voor Nederland. ”
        - heading "Motto" [level=3] [ref=e112]
        - paragraph [ref=e113]: “De Rijksoverheid. Voor Nederland.”
        - paragraph [ref=e114]
        - heading "De gemoderniseerde rijkshuisstijl" [level=1] [ref=e115]
        - paragraph [ref=e116]: De rijkshuisstijl is in 2008 gelanceerd en het Rijksoverheid logo is inmiddels niet meer weg te denken. In 2024 is de rijkshuisstijl gemoderniseerd. Deze gemoderniseerde rijkshuisstijl sluit beter aan bij de huidige Rijksoverheid, die herkenbaar is en vertrouwen uitstraalt. Daarnaast is hij beter toepasbaar op moderne digitale kanalen en draagt bij aan de toegankelijkheid.
        - heading "Wat is er aangepast" [level=2] [ref=e117]
        - paragraph [ref=e118]: Het blauwe Rijksoverheid logo is zeker niet verdwenen, wel is het woordmerk anders opgemaakt. Daarnaast zijn de vormtaal, het lettertype, de kleuren en richtlijnen voor beeldtaal aangepast.
        - paragraph [ref=e119]: "Zie voor de uitwerking:"
        - paragraph [ref=e120]:
          - link "Type rijksorganisatie en stijl van de communicatie" [ref=e121] [cursor=pointer]:
            - /url: https://www.rijkshuisstijl.nl/modules/product/DigitalStyleGuide/default/grouplist.aspx?ItemId=10910
        - paragraph [ref=e122]:
          - link "Basiselementen ''nieuw''" [ref=e123] [cursor=pointer]:
            - /url: https://www.rijkshuisstijl.nl/modules/folder/brandguide/default/grouplist.aspx?ItemId=10479
        - paragraph [ref=e124]:
          - link "Richtlijnen middelen ''nieuw''" [ref=e125] [cursor=pointer]:
            - /url: https://www.rijkshuisstijl.nl/modules/folder/brandguide/default/grouplist.aspx?ItemId=10582
        - paragraph [ref=e126]: Er komt geen eenmalige overgangsdatum, maar er is gekozen voor een geleidelijke invoering. Daarom zal komende jaren de huidige uitstraling van de Rijksoverheid in stappen steeds meer veranderen naar de gemoderniseerde uitstraling.
        - paragraph [ref=e127]:
          - text: Neem voor vragen over de gemoderniseerde rijkshuisstijl contact op met één van de
